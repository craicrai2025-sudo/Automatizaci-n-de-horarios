<script>
"use strict";

// =====================================================
// CONFIGURACIÓN DE SUPABASE
// Reemplaza estos dos valores por los de tu proyecto.
// Utiliza Publishable Key, nunca Secret/service_role.
// =====================================================
const SUPABASE_URL = "https://vcciivtxwcjucmzrbyss.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qJyZL_gm_v9xVPZ5CnFRpA_RstE_NjB";

let supabaseClient = null;
let activeUser = null;
let cloudReady = false;
let isLoadingCloud = false;

function showAuthError(message){
 const box=document.getElementById("authError");
 if(box){box.textContent=message;box.classList.remove("hidden")}
}
function clearAuthError(){
 const box=document.getElementById("authError");
 if(box){box.textContent="";box.classList.add("hidden")}
}
function setAppVisible(visible){
 document.getElementById("authScreen").classList.toggle("hidden",visible);
 document.getElementById("appShell").classList.toggle("authLocked",!visible);
}
function setSaveStatus(message,pending=false){
 const el=document.getElementById("saveStatus");
 if(!el)return;
 el.textContent=message;
 el.classList.toggle("pending",pending);
}
function initSupabase(){
 if(!window.supabase||!window.supabase.createClient){
  showAuthError("No se pudo cargar la biblioteca de Supabase. Comprueba tu conexión a internet y recarga la página.");
  return false;
 }
 if(SUPABASE_URL.startsWith("PEGA_AQUI")||SUPABASE_PUBLISHABLE_KEY.startsWith("PEGA_AQUI")){
  showAuthError("Falta configurar SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY en el archivo index.html.");
  return false;
 }
 try{
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
   auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  return true;
 }catch(e){
  showAuthError("No fue posible iniciar Supabase: "+(e.message||e));
  return false;
 }
}
async function signIn(event){
 event.preventDefault();
 clearAuthError();
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;
 const button=document.getElementById("loginButton");
 button.disabled=true;
 button.textContent="Ingresando...";
 try{
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)throw error;
  await activateSession(data.session);
 }catch(e){
  showAuthError("No fue posible iniciar sesión. Verifica el correo y la contraseña. Detalle: "+(e.message||e));
 }finally{
  button.disabled=false;
  button.textContent="Iniciar sesión";
 }
}
async function signOut(){
 if(dirty&&!confirm("Hay cambios pendientes que no se han guardado en Supabase. Si cierras sesión, esos cambios se perderán. ¿Deseas continuar?"))return;
 if(!confirm("¿Deseas cerrar la sesión?"))return;
 try{
  const {error}=await supabaseClient.auth.signOut();
  if(error)throw error;
  activeUser=null;
  cloudReady=false;
  setAppVisible(false);
 }catch(e){
  alert("No fue posible cerrar sesión: "+(e.message||e));
 }
}
async function activateSession(session){
 if(!session||!session.user)return;
 activeUser=session.user;
 document.getElementById("userEmail").textContent=activeUser.email||"Sesión activa";
 setAppVisible(true);
 await loadCloudData();
}
async function loadCloudData(){
 if(!supabaseClient||!activeUser)return;
 isLoadingCloud=true;
 cloudReady=false;
 setSaveStatus("Cargando desde la nube...",true);
 try{
  const {data,error}=await supabaseClient
   .from("crai_app_state")
   .select("state,updated_at")
   .eq("id",1)
   .single();
  if(error)throw error;
  const cloudState=data&&data.state?data.state:{};
  if(cloudState&&Object.keys(cloudState).length){
   if(Array.isArray(cloudState.staff))staff=cloudState.staff;
   if(Array.isArray(cloudState.history))history=cloudState.history;
   manualDays=Array.isArray(cloudState.manualDays)?cloudState.manualDays:[];
   current=cloudState.current||null;
   if(current)readOnly=!!current.locked;
   if(cloudState.form){
    if(cloudState.form.weekDate)document.getElementById("weekDate").value=cloudState.form.weekDate;
    document.getElementById("weekName").value=cloudState.form.weekName||"";
    document.getElementById("scheduleType").value=cloudState.form.scheduleType||"semestral";
    document.getElementById("dayType").value=cloudState.form.dayType||"normal";
   }
   staff=staff.map((p,i)=>({
    ...DEFAULTS.find(d=>d.id===p.id),
    ...p,
    group:["A","B","C"].includes(p.group)?p.group:["A","B","C"][i%3],
    noSaturday:!!p.noSaturday
   }));
   renderPreferences();
   renderManualDays();
   changeType();
   renderHistory();
   if(current){
    document.getElementById("optionsPanel").classList.remove("hidden");
    document.getElementById("optionsMessage").textContent="Horario recuperado desde Supabase.";
    openCurrent();
   }else{
    document.getElementById("editorPanel").classList.add("hidden");
   }
   dirty=false;
   setSaveStatus("Sin cambios pendientes");
  }else{
   renderPreferences();
   renderManualDays();
   changeType();
   renderHistory();
   dirty=true;
   setSaveStatus("Configuración inicial sin guardar",true);
   alert("La conexión con Supabase funciona. La base de datos todavía está vacía. Revisa la información inicial y pulsa Guardar configuración para almacenar la primera versión.");
  }
  cloudReady=true;
 }catch(e){
  setSaveStatus("Error al cargar",true);
  showAuthError("Iniciaste sesión, pero no se pudieron cargar los datos de Supabase. Comprueba las políticas RLS, el UID administrador y los permisos de la tabla. Detalle: "+(e.message||e));
  setAppVisible(false);
  await supabaseClient.auth.signOut();
 }finally{
  isLoadingCloud=false;
 }
}
function buildCloudState(){
 return {
  version:1,
  staff,
  history,
  current,
  manualDays,
  form:{
   weekDate:document.getElementById("weekDate").value,
   weekName:document.getElementById("weekName").value,
   scheduleType:document.getElementById("scheduleType").value,
   dayType:document.getElementById("dayType").value
  }
 };
}
async function saveData(){
 if(!activeUser||!cloudReady||!supabaseClient){
  alert("Debes iniciar sesión y cargar la información antes de guardar.");
  return;
 }
 if(isLoadingCloud)return;
 try{
  setSaveStatus("Guardando en Supabase...",true);
  const payload={
   id:1,
   state:buildCloudState(),
   updated_at:new Date().toISOString(),
   updated_by:activeUser.id
  };
  const {error}=await supabaseClient
   .from("crai_app_state")
   .upsert(payload,{onConflict:"id"});
  if(error)throw error;
  localStorage.setItem("crai_staff_v4",JSON.stringify(staff));
  localStorage.setItem("crai_history_v4",JSON.stringify(history));
  if(current)localStorage.setItem("crai_current_v4",JSON.stringify(current));
  dirty=false;
  setSaveStatus("Guardado en Supabase");
  alert("Información guardada correctamente en Supabase. Ya estará disponible al iniciar sesión desde otro computador.");
 }catch(e){
  setSaveStatus("Error al guardar",true);
  alert("No fue posible guardar en Supabase. Revisa permisos y políticas RLS. "+(e.message||""));
 }
}

const DEFAULTS=[
 {id:'a1',name:'Cristian Yagama',role:'aux',site:CORE[0],pref:'1',satPref:'1',group:'A',noSaturday:false},
 {id:'a2',name:'Jonnathan Cardenas',role:'aux',site:CORE[1],pref:'2',satPref:'2',group:'B',noSaturday:false},
 {id:'a3',name:'Angela Rubiano',role:'aux',site:CORE[2],pref:'3',satPref:'3',group:'C',noSaturday:false},
 {id:'a4',name:'Camilo Castañeda',role:'aux',site:CORE[3],pref:'1',satPref:'1',group:'A',noSaturday:false},
 {id:'a5',name:'Daniela Jiménez',role:'aux',site:CORE[0],pref:'2',satPref:'2',group:'B',noSaturday:false},
 {id:'a6',name:'John Rojas',role:'aux',site:CORE[1],pref:'3',satPref:'3',group:'C',noSaturday:false},
 {id:'a7',name:'Nataly Pulgarin',role:'aux',site:CORE[2],pref:'1',satPref:'1',group:'A',noSaturday:false},
 {id:'a8',name:'Wilmar Molina',role:'aux',site:CORE[3],pref:'2',satPref:'2',group:'B',noSaturday:false},
 {id:'i1',name:'Johanna Jeréz',role:'info',site:CORE[0],pref:'1',satPref:'1',group:'A',noSaturday:false},
 {id:'i2',name:'Juan José Mateus',role:'info',site:CORE[1],pref:'2',satPref:'2',group:'B',noSaturday:false},
 {id:'i3',name:'Yulieth Castellar',role:'info',site:CORE[2],pref:'3',satPref:'3',group:'C',noSaturday:false},
 {id:'i4',name:'Sandra Herrera',role:'info',site:CORE[3],pref:'1',satPref:'1',group:'A',noSaturday:false},
 {id:'i5',name:'René Julio Sumosa',role:'info',site:CORE[0],pref:'2',satPref:'2',group:'B',noSaturday:false},
 {id:'i6',name:'Luis Gabriel Garcia',role:'info',site:CORE[1],pref:'3',satPref:'3',group:'C',noSaturday:false},
 {id:'i7',name:'Christian Luna',role:'info',site:CORE[2],pref:'1',satPref:'1',group:'A',noSaturday:false},
 {id:'m1',name:'Yesid Sanabria',role:'multi',site:CORE[0],pref:'1',satPref:'1',group:'A',noSaturday:false},
 {id:'m2',name:'Milton Garcia',role:'multi',site:CORE[1],pref:'2',satPref:'2',group:'B',noSaturday:false},
 {id:'m3',name:'Luisa Sarmiento',role:'multi',site:CORE[2],pref:'3',satPref:'3',group:'C',noSaturday:false},
 {id:'m4',name:'Tania Alvarado',role:'multi',site:CORE[3],pref:'1',satPref:'1',group:'A',noSaturday:false},
 {id:'m5',name:'Diego Gómez',role:'multi',site:CORE[0],pref:'2',satPref:'2',group:'B',noSaturday:false},
 {id:'m6',name:'Laura Quintero',role:'multi',site:CORE[1],pref:'3',satPref:'3',group:'C',noSaturday:false}
];
let staff=JSON.parse(JSON.stringify(DEFAULTS));
let history=readStore('crai_history_v4',[]);
let current=readStore('crai_current_v4',null);
let manualDays=[];
let dirty=false,readOnly=false,undoStack=[];
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function readStore(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function markDirty(){dirty=true;const s=document.getElementById('saveStatus');s.textContent='Cambios pendientes';s.classList.add('pending')}
function snapshot(){undoStack.push(JSON.parse(JSON.stringify(current)));if(undoStack.length>30)undoStack.shift()}
function undo(){if(!undoStack.length||readOnly)return;current=undoStack.pop();markDirty();renderSchedule()}
function toggleMenu(){document.getElementById('menu').classList.toggle('hidden')}
function navigate(id){['creation','preferences','history'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.getElementById('menu').classList.add('hidden');if(id==='history')renderHistory()}
function changeType(){const t=document.getElementById('scheduleType').value;document.getElementById('typeDescription').textContent=t==='semestral'?'Horario de lunes a viernes (6:00 am - 9:00 pm / Sábado 8:00 am - 3:00 pm)':t==='intersemestral'?'Horario intersemestral: jornada ajustada según la configuración vigente.':'Horario manual: define días, sedes y horas.';document.getElementById('manualConfig').classList.toggle('hidden',t!=='manual');document.getElementById('manualSiteSelect').innerHTML=SITES.map(s=>`<option>${esc(s)}</option>`).join('')}
function addManualDay(){const day=document.getElementById('manualDaySelect').value,site=document.getElementById('manualSiteSelect').value,start=document.getElementById('manualStart').value,end=document.getElementById('manualEnd').value;if(!start||!end||end<=start){alert('Configura horas válidas.');return}manualDays=manualDays.filter(x=>x.day!==day);manualDays.push({day,site,start,end,off:false});markDirty();renderManualDays()}
function renderManualDays(){document.getElementById('manualDays').innerHTML=manualDays.map((d,i)=>`<div class="manualDay"><b>${esc(d.day)}</b><span>${esc(d.site)}</span><span>${d.start}–${d.end}</span><button class="danger" onclick="removeManualDay(${i})">Eliminar</button></div>`).join('')}
function removeManualDay(i){manualDays.splice(i,1);markDirty();renderManualDays()}
function addPerson(){const name=prompt('Nombre completo de la persona:');if(!name)return;const role=prompt('Perfil: aux, info o multi','aux');if(!ROLES[role]){alert('Perfil no válido.');return}staff.push({id:'p'+Date.now(),name:name.trim(),role,site:CORE[0],pref:'1',satPref:'1',group:'A',noSaturday:false});markDirty();renderPreferences()}
 function renderPreferences(){
 const box=document.getElementById('preferencePeople');
 box.innerHTML=staff.map(p=>`<div class="person role-${p.role}">
  <div class="personName">${esc(p.name)} <span class="small">(${ROLES[p.role]})</span></div>
  <div class="personFields">
   <div><label>Nombre</label><input value="${esc(p.name)}" onchange="updatePerson('${p.id}','name',this.value)"></div>
   <div><label>Perfil</label><select onchange="updatePerson('${p.id}','role',this.value)">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${p.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
   <div><label>Sede habitual</label><select onchange="updatePerson('${p.id}','site',this.value)">${siteOpts(p.site)}</select></div>
   <div><label>Turno preferido</label><select onchange="updatePerson('${p.id}','pref',this.value)">${shiftOpts(p.pref)}</select></div>
   <div><label>Preferencia sábado</label><select onchange="updatePerson('${p.id}','satPref',this.value)"><option value="1" ${p.satPref==='1'?'selected':''}>Mañana</option><option value="2" ${p.satPref==='2'?'selected':''}>Intermedio</option><option value="3" ${p.satPref==='3'?'selected':''}>Tarde</option></select></div>
   <div><label>Grupo</label><select onchange="updatePerson('${p.id}','group',this.value)"><option ${p.group==='A'?'selected':''}>A</option><option ${p.group==='B'?'selected':''}>B</option><option ${p.group==='C'?'selected':''}>C</option></select></div>
  </div>
  <div class="actions"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" style="width:auto" ${p.noSaturday?'checked':''} onchange="updatePerson('${p.id}','noSaturday',this.checked)"> No trabaja sábados</label><button class="danger" onclick="deletePerson('${p.id}')">Eliminar persona</button></div>
 </div>`).join('');
}
function updatePerson(id,key,value){const p=staff.find(x=>x.id===id);if(!p)return;p[key]=value;markDirty();if(key==='role')renderPreferences()}
function deletePerson(id){const p=staff.find(x=>x.id===id);if(!p||!confirm(`¿Eliminar a ${p.name}?`))return;staff=staff.filter(x=>x.id!==id);markDirty();renderPreferences()}
function siteOpts(selected){return SITES.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}
function shiftOpts(selected){return Object.entries(SHIFTS).map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${v}</option>`).join('')}
function shiftTimes(p,shift,day,site,group){
 if(day==='Sábado')return ['08:00','15:00'];
 const t=shift||p.pref;
 if(t==='1')return ['06:00','15:00'];
 if(t==='2')return ['08:00','17:00'];
 if(t==='3')return ['12:00','21:00'];
 if(t==='i1')return ['07:00','16:00'];
 if(t==='i2')return ['10:00','19:00'];
 return ['08:00','17:00'];
}
function generate(group){
 if(dirty&&!confirm('Hay cambios pendientes. Si generas una nueva propuesta, estos cambios podrían reemplazarse. ¿Continuar?'))return;
 const type=document.getElementById('scheduleType').value;
 const weekDate=document.getElementById('weekDate').value;
 const weekName=document.getElementById('weekName').value||'Semana';
 if(!weekDate){alert('Selecciona la fecha del lunes.');return}
 const days=type==='manual'?manualDays.filter(d=>!d.off).map(d=>d.day):DAYS;
 const people=staff.map(p=>({...JSON.parse(JSON.stringify(p)),days:{}}));
 const assigned={};
 days.forEach(day=>{
  const sites=type==='manual'?manualDays.filter(d=>d.day===day&&!d.off).map(d=>d.site):day==='Sábado'?['Claustro USEB','Claustro Mezanine']:CORE;
  ['aux','info','multi'].forEach(role=>{
   const available=people.filter(p=>p.role===role&&!(day==='Sábado'&&(p.noSaturday||p.group!==group)));
   sites.forEach((site,index)=>{
    const already=Object.values(assigned).flat().filter(x=>x.id&&x.id===x.personId).length;
    const candidates=available.filter(p=>!p.days[day]&&!assigned[day]?.some(x=>x.id===p.id));
    const preferred=candidates.sort((a,b)=>(a.site===site?-1:0)-(b.site===site?-1:0));
    const person=preferred[index%Math.max(1,preferred.length)];
    if(person){person.days[day]={site,shift:day==='Sábado'?person.satPref:person.pref,rest:false};(assigned[day]??=[]).push({id:person.id})}
   });
  });
  people.filter(p=>!p.days[day]).forEach(p=>p.days[day]={site:'',shift:'',rest:true});
 });
 current={weekDate,weekName,group,type,days,people,manualDays:JSON.parse(JSON.stringify(manualDays)),locked:false};
 readOnly=false;undoStack=[];dirty=true;
 document.getElementById('optionsPanel').classList.remove('hidden');
 document.getElementById('optionsMessage').textContent=`Propuesta generada para ${weekName}, grupo ${group}. Revisa la cobertura y los turnos.`;
 openCurrent();
}
function openCurrent(){
 if(!current)return;
 document.getElementById('editorPanel').classList.remove('hidden');
 document.getElementById('editorTitle').textContent=`${current.weekName||'Semana'} · Grupo ${current.group||'-'}`;
 document.getElementById('editorSubtitle').textContent=`Semana del ${current.weekDate||'sin fecha'} · ${current.type||'semestral'}`;
 renderSchedule();
}
function renderSchedule(){
 if(!current)return;
 const table=document.getElementById('scheduleTable');
 const readOnly=!!current.locked;
 table.innerHTML=`<thead><tr><th>Colaborador</th>${current.days.map(day=>`<th colspan="3">${esc(day)}</th>`).join('')}</tr><tr><th>Nombre / perfil</th>${current.days.map(()=>'<th>Sede</th><th>Turno / inicio</th><th>Fin</th>').join('')}</tr></thead><tbody>${
 current.people.map(p=>`<tr style="background:${COLORS[p.role]||'#fff'}"><td><b>${esc(p.name)}</b><br><span class="small">${ROLES[p.role]}</span></td>${
 current.days.map(day=>{
  const d=p.days[day];if(!d||d.rest)return '<td colspan="3" class="rest">Descanso</td>';
  const times=d.start&&d.end?[d.start,d.end]:shiftTimes(p,d.shift,day,d.site,current.group==='-'?'-':current.group);
  if(readOnly)return `<td>${esc(d.site)}</td><td>${esc(SHIFTS[d.shift]||d.shift)}<br>${times[0]}</td><td>${times[1]}</td>`;
  return `<td class="${d.editedSite?'edited':''}"><select onchange="editCell('${p.id}','${day}','site',this.value)">${siteOpts(d.site)}</select></td><td class="${d.editedShift?'edited':''}"><select onchange="editCell('${p.id}','${day}','shift',this.value)">${shiftOpts(d.shift)}</select><br>${times[0]}</td><td class="${d.editedTime?'edited':''}">${times[1]}</td>`;
 }).join('')}</tr>`).join('')}</tbody>`;
 document.getElementById('editPerson').innerHTML=current.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
 document.getElementById('editDay').innerHTML=current.days.map(d=>`<option>${esc(d)}</option>`).join('');
 document.getElementById('editSite').innerHTML=siteOpts(SITES[0]);
 document.getElementById('editShift').innerHTML=shiftOpts('1');
 document.getElementById('editReplace').innerHTML=current.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
 ['editPerson','editDay','editAction','editSite','editShift','editStart','editEnd','editReplace'].forEach(id=>document.getElementById(id).disabled=readOnly);
 document.querySelectorAll('#manualEditor button').forEach(b=>b.disabled=readOnly);
 document.getElementById('manualEditor').classList.toggle('hidden',readOnly);
 renderManualEditor();
 validate();
}
function editCell(id,day,key,value){
 if(readOnly)return;
 snapshot();
 const p=current.people.find(x=>x.id===id);
 if(!p)return;
 const d=p.days[day];
 if(!d)return;
 d[key]=value;d.manual=true;
 d[key==='site'?'editedSite':'editedShift']=true;
 delete d.start;delete d.end;
 markDirty();renderSchedule();
}
function toggleEditFields(){
 const a=document.getElementById('editAction').value;
 ['editSiteBox','editShiftBox','editStartBox','editEndBox','editReplaceBox'].forEach(id=>document.getElementById(id).classList.add('hidden'));
 if(a==='site')document.getElementById('editSiteBox').classList.remove('hidden');
 if(a==='shift')document.getElementById('editShiftBox').classList.remove('hidden');
 if(a==='time'){document.getElementById('editStartBox').classList.remove('hidden');document.getElementById('editEndBox').classList.remove('hidden')}
 if(a==='replace')document.getElementById('editReplaceBox').classList.remove('hidden');
}
function renderManualEditor(){
 if(!current)return;
 const id=document.getElementById('editPerson').value,day=document.getElementById('editDay').value,p=current.people.find(x=>x.id===id);
 if(!p||!day)return;
 const d=p.days[day];
 document.getElementById('editSite').value=d&&!d.rest?d.site:SITES[0];
 document.getElementById('editShift').value=d&&!d.rest?d.shift:p.pref;
 document.getElementById('editReplace').value=p.id;
 const times=d&&!d.rest?(d.start&&d.end?[d.start,d.end]:shiftTimes(p,d.shift,day,d.site,current.group)):['',''];
 document.getElementById('editStart').value=times[0];
 document.getElementById('editEnd').value=times[1];
 document.getElementById('manualCurrent').textContent=!d||d.rest?`${p.name}: descanso el ${day}.`:`${p.name}: ${day}, ${d.site}, ${times[0]}–${times[1]}.`;
 toggleEditFields();
}
function applyEdit(){
 if(!current||readOnly)return;
 const id=document.getElementById('editPerson').value,day=document.getElementById('editDay').value,action=document.getElementById('editAction').value,p=current.people.find(x=>x.id===id);
 if(!p)return;
 snapshot();
 let d=p.days[day]||{site:p.site,shift:p.pref,rest:false};
 if(action==='rest')p.days[day]={site:'',shift:'',rest:true,manual:true};
 else if(action==='replace'){
  const other=current.people.find(x=>x.id===document.getElementById('editReplace').value);
  if(!other||other.id===p.id){undoStack.pop();alert('Selecciona otro colaborador.');return}
  other.days[day]={...d,manual:true,editedSite:true};
  p.days[day]={site:'',shift:'',rest:true,manual:true};
 }else{
  if(d.rest)d={site:p.site,shift:p.pref,rest:false};
  if(action==='site'){d.site=document.getElementById('editSite').value;d.editedSite=true}
  if(action==='shift'){d.shift=document.getElementById('editShift').value;d.editedShift=true;delete d.start;delete d.end}
  if(action==='time'){
   const start=document.getElementById('editStart').value,end=document.getElementById('editEnd').value;
   if(!start||!end||end<=start){undoStack.pop();alert('Introduce horas válidas. La hora de fin debe ser posterior al inicio.');return}
   d.start=start;d.end=end;d.editedTime=true;
  }
  d.manual=true;p.days[day]=d;
 }
 markDirty();renderSchedule();
}
 function validate(){
 const errors=[];
 current.days.forEach(day=>{
  const dayPeople=current.people.filter(p=>p.days[day]&&!p.days[day].rest);
  const sites=current.type==='manual'?current.manualDays.filter(d=>d.day===day&&!d.off).map(d=>d.site):CORE;
  sites.forEach(site=>['aux','info','multi'].forEach(role=>{
   if(!dayPeople.some(p=>p.role===role&&p.days[day].site===site)){
    errors.push(`${day}: falta ${ROLES[role]} en ${site}.`);
   }
  }));
 });
 if(current.days.includes('Sábado')){
  const sat=current.people.filter(p=>p.days.Sábado&&!p.days.Sábado.rest);
  ['aux','info','multi'].forEach(role=>{
   if(!sat.some(p=>p.role===role&&['Claustro USEB','Claustro Mezanine'].includes(p.days.Sábado.site))){
    errors.push(`Sábado: falta ${ROLES[role]} en Claustro USEB y Claustro Mezanine.`);
   }
  });
 }
 document.getElementById('validation').innerHTML=errors.length
  ?`<div class="validationError"><b>${errors.length} incumplimiento(s) detectado(s)</b><ul>${errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`
  :'<div class="validationOk">La cobertura mínima configurada está asignada. Esto no certifica por sí solo las horas contractuales ni todas las restricciones laborales.</div>';
}
function finalizeSchedule(){
 if(!current||readOnly)return;
 const bad=document.getElementById('validation').querySelector('.validationError');
 if(bad&&!confirm('El horario tiene errores de cobertura. ¿Quieres finalizarlo de todas formas?'))return;
 if(!confirm('¿Finalizar esta semana? El registro del historial quedará bloqueado.'))return;
 current.locked=true;
 current.finalizedAt=new Date().toISOString();
 history.unshift(JSON.parse(JSON.stringify(current)));
 readOnly=true;
 markDirty();
 saveData();
 renderSchedule();
 alert('Horario finalizado y agregado al historial.');
}
function renderHistory(){
 const box=document.getElementById('historyList');
 if(!history.length){
  box.innerHTML='<p class="muted">No hay horarios en el historial.</p>';
  return;
 }
 box.innerHTML=history.map((h,i)=>`<div class="historyItem">
  <div><b>${esc(h.weekName||'Semana')} · Horario ${esc(h.group||'')}</b>
   <div class="muted">${esc(h.weekDate||'Sin fecha')} · ${h.locked?'Finalizado':'Guardado'}</div>
  </div>
  <div class="actions">
   <button onclick="openHistory(${i})">Consultar</button>
   <button class="secondary" onclick="exportHistory(${i})">Exportar CSV</button>
  </div>
 </div>`).join('');
}
function openHistory(i){
 current=JSON.parse(JSON.stringify(history[i]));
 readOnly=!!current.locked;
 undoStack=[];
 openCurrent();
 navigate('creation');
}
function clearHistory(){
 if(!confirm('¿Borrar el historial de este navegador?'))return;
 history=[];
 markDirty();
 renderHistory();
}
function csvQ(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){
 if(!current)return;
 const rows=[['Colaborador','Perfil',...current.days.flatMap(d=>[d+' - Sede',d+' - Inicio',d+' - Turno',d+' - Fin'])]];
 current.people.forEach(p=>{
  const r=[p.name,ROLES[p.role]];
  current.days.forEach(day=>{
   const d=p.days[day];
   if(!d||d.rest)r.push('Descanso','','','');
   else{
    const t=d.start&&d.end?[d.start,d.end]:shiftTimes(p,d.shift,day,d.site,current.group);
    r.push(d.site,t[0],SHIFTS[d.shift]||d.shift,t[1]);
   }
  });
  rows.push(r);
 });
 const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csvQ).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='horario_CRAI_'+current.group+'.csv';a.click();
 URL.revokeObjectURL(url);
}
function exportHistory(i){
 const prev=current;
 current=history[i];
 exportCSV();
 current=prev;
}
function backup(){
 const blob=new Blob([JSON.stringify({staff,history,manualDays,current},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='respaldo_CRAI.json';a.click();
 URL.revokeObjectURL(url);
}
function importBackup(file){
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!Array.isArray(d.staff)||!Array.isArray(d.history))throw Error();
   if(!confirm('La importación reemplazará los datos actuales. ¿Continuar?'))return;
   staff=d.staff;
   history=d.history;
   manualDays=d.manualDays||[];
   current=d.current||null;
   markDirty();
   renderPreferences();
   renderManualDays();
   renderHistory();
   alert('Copia importada. Pulsa Guardar cambios para conservarla en Supabase.');
  }catch(e){
   alert('El archivo no es una copia válida del Generador CRAI.');
  }
 };
 r.readAsText(file);
}

// =====================================================
// INICIO DE LA APLICACIÓN
// =====================================================
document.getElementById('weekDate').value=(()=>{
 const d=new Date();
 d.setDate(d.getDate()-((d.getDay()+6)%7));
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
})();

changeType();
renderPreferences();
setAppVisible(false);

if(initSupabase()){
 supabaseClient.auth.getSession().then(async ({data,error})=>{
  if(error){
   showAuthError(error.message);
   return;
  }
  if(data.session)await activateSession(data.session);
 }).catch(e=>showAuthError(e.message||String(e)));

 supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'){
   activeUser=null;
   cloudReady=false;
   setAppVisible(false);
  }
 });
}
